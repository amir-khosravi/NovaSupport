name: novasupport

# ── Infrastructure ─────────────────────────────────────────────────────────────

services:

  redpanda:
    image: redpandadata/redpanda:v24.1.7
    container_name: novasupport-kafka
    command:
      - redpanda
      - start
      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:9094
      - --advertise-kafka-addr internal://redpanda:9092,external://localhost:9094
      - --rpc-addr redpanda:33145
      - --advertise-rpc-addr redpanda:33145
      - --mode dev-container
      - --smp 1
      - --default-log-level=warn
    ports:
      - "9094:9094"
    volumes:
      - kafka_data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy'"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 20s
    networks:
      - novasupport

  kafka-ui:
    image: redpandadata/console:v2.5.2
    container_name: novasupport-kafka-ui
    ports:
      - "8080:8080"
    depends_on:
      redpanda:
        condition: service_healthy
    entrypoint: /bin/sh
    command: >-
      -c 'printf "kafka:\n  brokers: [\"redpanda:9092\"]\n" > /tmp/cfg.yml && /app/console --config.filepath /tmp/cfg.yml'
    networks:
      - novasupport

  postgres:
    image: postgres:16-alpine
    container_name: novasupport-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: novasupport
      POSTGRES_USER: novasupport
      POSTGRES_PASSWORD: novasupport_secret
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U novasupport -d novasupport"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - novasupport

  redis:
    image: redis:7-alpine
    container_name: novasupport-redis
    ports:
      - "6379:6379"
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - novasupport

  qdrant:
    image: qdrant/qdrant:v1.9.4
    container_name: novasupport-qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:6333/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - novasupport

  # ── Init job: schema + Kafka topics (runs once then exits) ────────────────────

  novasupport-init:
    build: .
    container_name: novasupport-init
    env_file: .env
    environment:
      KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
      POSTGRES_URL: postgresql+asyncpg://novasupport:novasupport_secret@postgres:5432/novasupport
    command: python infrastructure/init_docker.py
    depends_on:
      redpanda:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: "no"
    networks:
      - novasupport

  # ── Application services ──────────────────────────────────────────────────────

  api:
    build: .
    container_name: novasupport-api
    env_file: .env
    environment:
      KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
      POSTGRES_URL: postgresql+asyncpg://novasupport:novasupport_secret@postgres:5432/novasupport
      REDIS_URL: redis://redis:6379/0
      QDRANT_URL: http://qdrant:6333
      MCP_OPERATIONAL_DATA_URL: http://mcp-server:8001/sse
      APP_ENV: production
      API_RELOAD: "false"
    command: uvicorn apps.api.main:app --host 0.0.0.0 --port 8000 --workers 2
    ports:
      - "8000:8000"
    depends_on:
      redpanda:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      novasupport-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    networks:
      - novasupport

  orchestrator:
    build: .
    container_name: novasupport-orchestrator
    env_file: .env
    environment:
      KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
      POSTGRES_URL: postgresql+asyncpg://novasupport:novasupport_secret@postgres:5432/novasupport
      REDIS_URL: redis://redis:6379/0
      QDRANT_URL: http://qdrant:6333
      MCP_OPERATIONAL_DATA_URL: http://mcp-server:8001/sse
      APP_ENV: production
    command: python -m apps.orchestrator
    depends_on:
      redpanda:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      novasupport-init:
        condition: service_completed_successfully
    restart: unless-stopped
    networks:
      - novasupport

  worker:
    build: .
    container_name: novasupport-worker
    env_file: .env
    environment:
      KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
      POSTGRES_URL: postgresql+asyncpg://novasupport:novasupport_secret@postgres:5432/novasupport
      REDIS_URL: redis://redis:6379/0
      QDRANT_URL: http://qdrant:6333
      MCP_OPERATIONAL_DATA_URL: http://mcp-server:8001/sse
      APP_ENV: production
    command: python -m apps.worker --id docker-worker --count 3
    depends_on:
      redpanda:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      novasupport-init:
        condition: service_completed_successfully
    restart: unless-stopped
    networks:
      - novasupport

  mcp-server:
    build: .
    container_name: novasupport-mcp
    env_file: .env
    environment:
      POSTGRES_URL: postgresql+asyncpg://novasupport:novasupport_secret@postgres:5432/novasupport
      APP_ENV: production
    command: python -m mcp_servers.operational_data.server
    ports:
      - "8001:8001"
    depends_on:
      postgres:
        condition: service_healthy
      novasupport-init:
        condition: service_completed_successfully
    restart: unless-stopped
    networks:
      - novasupport

  # ── Observability ─────────────────────────────────────────────────────────────

  prometheus:
    image: prom/prometheus:v2.52.0
    container_name: novasupport-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./infrastructure/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.console.libraries=/usr/share/prometheus/console_libraries
      - --web.console.templates=/usr/share/prometheus/consoles
    depends_on:
      - api
    restart: unless-stopped
    networks:
      - novasupport

  grafana:
    image: grafana/grafana:10.4.3
    container_name: novasupport-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: novasupport
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infrastructure/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
    restart: unless-stopped
    networks:
      - novasupport

# ── Volumes & Networks ────────────────────────────────────────────────────────

volumes:
  kafka_data:
  postgres_data:
  redis_data:
  qdrant_data:
  prometheus_data:
  grafana_data:

networks:
  novasupport:
    driver: bridge
