[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "novasupport"
version = "0.1.0"
description = "Event-Driven Multi-Agent E-Commerce Support Platform"
readme = "README.md"
requires-python = ">=3.12,<3.14"

dependencies = [
    # LangGraph and LangChain
    "langgraph>=0.2.0",
    "langchain-core>=0.3.0",
    "langchain-anthropic>=0.3.0",
    "langchain-community>=0.3.0",
    # Pydantic and settings
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    # FastAPI and server
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    # Database
    "sqlalchemy[asyncio]>=2.0.0",
    "alembic>=1.13.0",
    "asyncpg>=0.29.0",
    # Kafka
    "aiokafka>=0.11.0",
    # Vector store
    "qdrant-client>=1.9.0",
    # Cache
    "redis[hiredis]>=5.0.0",
    # HTTP client
    "httpx>=0.27.0",
    # Logging
    "structlog>=24.2.0",
    # Observability
    "opentelemetry-sdk>=1.25.0",
    "opentelemetry-instrumentation-fastapi>=0.46b0",
    "opentelemetry-instrumentation-httpx>=0.46b0",
    "prometheus-client>=0.20.0",
    # Embeddings
    "sentence-transformers>=3.0.0",
    # Document processing
    "python-frontmatter>=1.1.0",
    "tiktoken>=0.7.0",
    # Utilities
    "python-ulid>=2.2.0",
    "tenacity>=8.3.0",
    "mcp[cli]>=1.27.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "faker>=25.0.0",
    "rich>=13.7.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "ipython>=8.24.0",
    "pandas>=2.2.0",
    "datasets>=2.19.0",
]

[tool.hatch.build.targets.wheel]
packages = [
    "apps",
    "agents",
    "graph",
    "streaming",
    "mcp_servers",
    "mcp_clients",
    "rag",
    "persistence",
    "observability",
    "evaluation",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "evaluation: LLM quality eval tests (require Kafka + workers)",
    "smoke: HTTP smoke tests (require all services running)",
    "db: tests that require a seeded PostgreSQL database",
    "integration: tests that require live infrastructure",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true
